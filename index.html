<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario</title>
    <link rel="stylesheet" href="style.css">
    <style>
     @import url('https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,300..800;1,300..800&display=swap');
    </style>
</head>
<body>
    <div class="container">
        <div class="form-container">
            <div class="contact-header">
               <h1>Contacto</h1>
                <p>Por favor, completa el siguiente formulario para contactarnos.</p>
            </div>
            <form class="contact-form">
                <div class="form-group">
                    <label for="nombre">Nombre:</label>
                    <input type="text" id="nombre" name="nombre" required placeholder="Ingresa tu nombre">
                </div>
                <div class="form-group">
                    <label for="nombre">Apellido:</label>
                    <input type="text" id="Apellido" name="Apellido" required placeholder="Tu apellido">
                </div>


                <div class="form-group">
                    <label for="email">Correo Electrónico:</label>
                    <input type="email" id="email" name="email" required placeholder="Ingresa tu correo electrónico">
                </div>
                 <div class="form-group">
                    <label for="telefono">Teléfono:</label>
                    <input type="tel" id="telefono" name="telefono" pattern="[0-9]*" inputmode="numeric" placeholder="+54 9 342..." required>
                </div>

                <div class="form-group span-all">
                    <label for="mensaje">Mensaje:</label>
                    <textarea id="mensaje" name="mensaje" rows="4" required placeholder="Escribe tu mensaje"></textarea>
                </div>
                <div class="form-group span-all">
                    <label for="form-terms">
                        <input type="checkbox" id="form-terms" name="form-terms" required>
                        <p>Al contactarnos, usted acepta nuestros <a href="#">Términos y Condiciones</a>.</p>
                    </label>
                </div>

                <button type="submit" class="span-all">Enviar</button>
            </form>
            <dialog id="myDialog">
               p>¡Gracias por contactarnos!</p>
               <button id="closeDialog">Cerrar</button>
            </dialog>
        </div>
    </div>
</body>
</html>
